# AGP 9.x(2026-11 올림): Kotlin 이 AGP 에 내장돼 org.jetbrains.kotlin.android 플러그인을 쓰지 않는다.
#   - coreKtx: 1.17.0+ 는 compileSdk 36+ 요구 — compileSdk 35 를 유지하는 동안 1.16.0 상한.
#     compileSdk 를 올릴 때 같이 올릴 것.
#   - lifecycle: 명시 의존 없음(코드 참조 0건 — appcompat 의 전이 의존으로만 들어온다).
[versions]
agp = "9.5.0"
coreKtx = "1.16.0"
appcompat = "1.7.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
