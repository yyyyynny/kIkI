# 정식판만 쓴다(alpha·beta·RC·프리뷰 금지). 2026-11 기준 최신 정식판.
#   - agp 9.x 는 Kotlin 을 내장한다 — kotlin-android 는 루트에 apply false 로만 선언해 내장 Kotlin 버전을 올린다.
#   - coreKtx 1.19 는 compileSdk 37 이상을 요구한다(app/build.gradle.kts 의 compileSdk).
#   - lifecycle: 명시 의존 없음(코드 참조 0건 — appcompat 의 전이 의존으로만 들어온다).
#   - junit: 4.x 유지(JVM 단위 테스트가 4.x API 를 쓴다).
#   - targetSdk 는 36(37 아님): 36 의 동작 변경(뒤로가기 예측 애니메이션, 화면 끝까지 그리기 해제 불가, 큰 화면 방향·크기
#     고정 무시)은 공개 문서로 정리돼 있지만 37 의 변경은 아직 정리·실기기 확인 전이다. 37 의 변경은 Android 17 기기
#     (지금은 S25+ 한 대)에서만 적용되니, 올릴 땐 S25+ 에서 오버레이·뒤로가기·화면 가장자리부터 확인할 것.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
coreKtx = "1.19.1"
appcompat = "1.8.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
