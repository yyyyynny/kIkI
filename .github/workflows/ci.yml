name: CI

# 트리거(웹앱 템플릿과 동일 원칙):
#  - pull_request: PR 생성/갱신 시
#  - push: main 및 claude/** · ccr-* 작업 브랜치(클라우드 세션이 만드는 브랜치 이름 두 가지)
#  - workflow_dispatch: Actions 탭에서 수동 실행
on:
  pull_request:
  push:
    branches: [main, "claude/**", "ccr-*"]
  workflow_dispatch:

# 같은 ref 에 새 커밋이 오면 이전 실행을 자동 취소 → 빠른 피드백, 러너 절약
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한(코드 읽기만). 시크릿/서명키는 CI 에 넣지 않는다(릴리스 서명은 별도).
permissions:
  contents: read

jobs:
  # ── 검사 잡: Android Lint + 디버그 빌드 ────────────────────────────────────
  build-lint:
    name: 빌드 · 린트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 설치 (Temurin)   # AGP 9.5.0 / Gradle 9.8.2 최소 요구 버전
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 24 설치 (프로젝트 표준 — JS 기반 도구/스크립트용)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Gradle 설정 + 캐시
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Android SDK 설치
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # 이 액션의 packages 기본값은 "tools platform-tools" 인데, 구글이 구형 SDK Tools
          # (`tools`) 패키지를 저장소에서 내려 "Failed to find package 'tools'" 로 설치가
          # 실패한다(액션 자체가 exit 1 → 잡 전체 실패). 실제로 필요한 패키지는 바로 다음
          # 스텝에서 직접 지정해 설치하므로 여기선 아무것도 설치하지 않는다.
          packages: ""

      - name: 필요한 SDK 패키지 설치
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # versionName 은 마지막 커밋 날짜에서 자동 계산된다(app/build.gradle.kts 상단 주석 참조).
      # 저장소를 열지 않아도 이 실행이 어떤 버전을 빌드했는지 Actions 탭 요약에서 바로 보이게 한다.
      - name: 빌드 버전 확인
        run: |
          echo "### 빌드 버전: $(./gradlew -q printVersion)" >> "$GITHUB_STEP_SUMMARY"

      - name: Android Lint (lintDebug)
        run: |
          echo "::group::Android Lint 실행"
          ./gradlew lintDebug --stacktrace
          echo "::endgroup::"

      # 배포용은 코드·리소스를 줄인 릴리스 빌드(디버그 9.5MB → 약 1.6MB). 공유 키가 없으면 디버그 키로 서명된다.
      - name: 릴리스 APK 빌드 (assembleRelease)
        run: |
          echo "::group::릴리스 APK 빌드"
          ./gradlew assembleRelease --stacktrace
          echo "::endgroup::"

      - name: APK 업로드(아티팩트)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiki-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Lint 리포트 업로드(실패해도 항상)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ── 테스트 잡: 단위 테스트 ─────────────────────────────────────────────────
  test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 24 설치 (프로젝트 표준)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Gradle 설정 + 캐시
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Android SDK 설치
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""   # 위 잡과 동일 — 구글이 내린 `tools` 패키지 자동 설치 회피

      - name: 필요한 SDK 패키지 설치
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 단위 테스트 (testDebugUnitTest)
        run: |
          echo "::group::단위 테스트 실행"
          ./gradlew testDebugUnitTest --stacktrace
          echo "::endgroup::"

      - name: 테스트 리포트 업로드(실패해도 항상)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
